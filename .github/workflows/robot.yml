# .github/workflows/robot.yml
name: "Poolside: Laguna S 2.1"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  robot:
    # Solo dispara si el que comenta es el dueño del repo.
    # En repos públicos, cualquiera puede comentar. Sin esto
    # cualquier usuario drenaría tu API key con @robot.
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@robot')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@robot')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@robot')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@robot') || contains(github.event.issue.title, '@robot')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: "Ejecutar Poolside: Laguna S 2.1"
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const issue = context.payload.issue ?? context.payload.pull_request;
            const comment = context.payload.comment?.body ?? context.payload.review?.body ?? '';
            let diff = '';

            if (context.payload.pull_request) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: issueNumber,
                mediaType: { format: 'diff' }
              });
              diff = String(response.data).slice(0, 50000);
            }

            const prompt = `Eres Poolside: Laguna S 2.1, un asistente experto de codificación.
            Responde en español y ayuda con la solicitud descrita abajo.

            Convenciones del repositorio:
            - TypeScript estricto.
            - Módulos ESM.
            - Tests con vitest; no agregues otra librería de tests.
            - Archivos en src/ exportan por nombre, nunca default.
            - Tests en tests/<area>.spec.ts.

            Importante: esta integración solo puede responder en un comentario.
            No afirmes que has editado archivos, creado commits o abierto PRs.
            Proporciona un análisis, una propuesta concreta y, si procede, código
            o pasos que una persona pueda aplicar y verificar.

            Issue o PR #${issueNumber}: ${issue?.title ?? '(sin título)'}

            Descripción:
            ${issue?.body ?? '(sin descripción)'}

            Solicitud mencionada:
            ${comment}

            Diff de la PR, si existe:
            ${diff || '(no aplica)'}`;

            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.OPENROUTER_API_KEY}`,
                'Content-Type': 'application/json',
                'X-Title': 'PruebasGH600 robot'
              },
              body: JSON.stringify({
                model: 'poolside/laguna-s-2.1:free',
                messages: [{ role: 'user', content: prompt }],
                max_tokens: 4000,
                temperature: 0.7
              })
            });

            if (!response.ok) {
              throw new Error(`OpenRouter respondió ${response.status}: ${await response.text()}`);
            }

            const result = await response.json();
            const answer = result.choices?.[0]?.message?.content;
            if (!answer) {
              throw new Error('OpenRouter no devolvió contenido.');
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `## Poolside: Laguna S 2.1\n\n${answer}`
            });