# .github/workflows/copilot.yml
name: "Agente Copilot vía OpenRouter"

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    # Solo se ejecuta si quien comenta o crea la tarea tiene permisos adecuados
    if: |
      (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'assigned')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@copilot')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@robot'))
    runs-on: ubuntu-latest

    steps:
      - name: "Descargar repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.USER_PAT || secrets.GITHUB_TOKEN }}

      - name: "Configurar Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Compilación del servidor MCP propio y carga inicial de la base de datos
      - name: "Compilar servidor MCP y poblar base de datos"
        run: |
          cd mcp/notes-server
          npm ci
          npm run build
          node --experimental-strip-types scripts/seed.ts notes.db

      - name: "Ejecutar Agente con OpenRouter y contexto MCP Notes"
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'poolside/laguna-s-2.1:free' }}
          GITHUB_TOKEN: ${{ secrets.USER_PAT || secrets.GITHUB_TOKEN }}
          USER_ACTOR: ${{ github.actor }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            const { owner, repo } = context.repo;
            const issueNumber = context.payload.issue?.number ?? context.payload.pull_request?.number;
            const issue = context.payload.issue ?? context.payload.pull_request;
            const comment = context.payload.comment?.body ?? '';

            // 1. Obtener notas de notes.db (equivalente a las herramientas del servidor MCP)
            let notesContext = '';
            const dbPath = path.resolve('mcp/notes-server/notes.db');
            if (fs.existsSync(dbPath)) {
              try {
                const Database = require(path.resolve('mcp/notes-server/node_modules/better-sqlite3'));
                const db = new Database(dbPath);
                const rows = db.prepare('SELECT id, title, body, is_secret FROM notes WHERE is_secret = 0').all();
                notesContext = rows.map(r => `[Nota #${r.id}] ${r.title}: ${r.body}`).join('\n');
              } catch (e) {
                notesContext = '(No se pudieron leer las notas de la base de datos: ' + e.message + ')';
              }
            }

            // 2. Escaneo de archivos del repositorio para aportar contexto
            function getProjectFiles(dir = '.', list = []) {
              if (!fs.existsSync(dir)) return list;
              const files = fs.readdirSync(dir);
              for (const f of files) {
                if (f === 'node_modules' || f === '.git' || f === 'package-lock.json' || f === '.github' || f.endsWith('.db')) continue;
                const fullPath = path.join(dir, f);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory()) {
                  getProjectFiles(fullPath, list);
                } else if (/\.(ts|js|json|md|sql)$/i.test(f)) {
                  list.push({ path: fullPath, content: fs.readFileSync(fullPath, 'utf8') });
                }
              }
              return list;
            }

            const projectFiles = getProjectFiles('.');
            let codeContext = projectFiles.map(f => `--- ${f.path} ---\n${f.content}`).join('\n\n');
            if (codeContext.length > 25000) {
              codeContext = codeContext.slice(0, 25000) + '\n... (contenido truncado por longitud)';
            }

            // 3. Construcción del prompt
            const prompt = `### ROL Y OBJETIVO
            Eres un desarrollador sénior automatizado (GitHub Copilot a través de OpenRouter).
            Tu tarea es resolver la incidencia (issue) utilizando el contexto del repositorio y las notas del servidor MCP "notes".

            ### NOTAS DISPONIBLES (Servidor MCP Notes):
            ${notesContext || '(No hay notas disponibles)'}

            ### ARCHIVOS DEL PROYECTO:
            ${codeContext}

            ### INFORMACIÓN DE LA INCIDENCIA:
            - **Número y Título**: Issue #${issueNumber}: ${issue?.title ?? '(Sin título)'}
            - **Descripción**:
            ${issue?.body ?? '(Sin descripción)'}
            ${comment ? `\n- **Comentario Adicional**:\n${comment}` : ''}

            ### INSTRUCCIONES:
            1. Analiza el problema y diseña una solución limpia y eficiente.
            2. Apóyate en la información de las notas si resulta relevante.
            3. Responde EXCLUSIVAMENTE con un objeto JSON válido (sin bloques Markdown adicionales fuera del JSON) con la siguiente estructura:
            {
              "plan": "Explicación detallada en Markdown del análisis y los cambios realizados",
              "commitMessage": "feat: mensaje descriptivo del commit",
              "prTitle": "Título descriptivo de la Pull Request",
              "files": [
                {
                  "path": "ruta/relativa/del/archivo.ext",
                  "content": "contenido completo del archivo nuevo o modificado"
                }
              ]
            }`;

            // 4. Llamada a OpenRouter
            const modelName = process.env.OPENROUTER_MODEL || 'poolside/laguna-s-2.1:free';
            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.OPENROUTER_API_KEY}`,
                'Content-Type': 'application/json',
                'X-Title': 'Agente GitHub Copilot OpenRouter'
              },
              body: JSON.stringify({
                model: modelName,
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.2
              })
            });

            if (!response.ok) {
              throw new Error(`Error en OpenRouter (${response.status}): ${await response.text()}`);
            }

            const result = await response.json();
            const rawAnswer = result.choices?.[0]?.message?.content ?? '';

            let payload;
            try {
              const jsonMatch = rawAnswer.match(/\{[\s\S]*\}/);
              payload = JSON.parse(jsonMatch ? jsonMatch[0] : rawAnswer);
            } catch (e) {
              payload = { plan: rawAnswer, files: [] };
            }

            // 5. Publicar el plan como comentario en la incidencia
            if (payload.plan) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `## 🤖 Agente Copilot (OpenRouter: \`${modelName}\`)\n\n${payload.plan}`
              });
            }

            // 6. Aplicar cambios, hacer commit, subir rama y abrir Pull Request en borrador (Draft)
            if (payload.files && Array.isArray(payload.files) && payload.files.length > 0) {
              const branchName = `copilot/issue-${issueNumber}-${Date.now().toString().slice(-4)}`;
              const userActor = process.env.USER_ACTOR || 'github-actions[bot]';
              
              execSync(`git config user.name "${userActor}"`);
              execSync(`git config user.email "${userActor}@users.noreply.github.com"`);
              execSync(`git checkout -b ${branchName}`);

              for (const file of payload.files) {
                if (!file.path || typeof file.content !== 'string') continue;
                const dir = path.dirname(file.path);
                if (dir && dir !== '.') {
                  fs.mkdirSync(dir, { recursive: true });
                }
                fs.writeFileSync(file.path, file.content, 'utf8');
              }

              execSync('git add .');
              const commitMsg = payload.commitMessage || `feat: resolver incidencia #${issueNumber}`;
              execSync(`git commit -m "${commitMsg.replace(/"/g, '\\"')}"`);
              execSync(`git push origin ${branchName}`);

              const repoInfo = await github.rest.repos.get({ owner, repo });
              const defaultBranch = repoInfo.data.default_branch || 'main';

              const prTitle = payload.prTitle || `copilot: ${issue?.title ?? 'Incidencia #' + issueNumber}`;
              const prBody = `Implementación automatizada generada por el Agente Copilot a través de OpenRouter (\`${modelName}\`).\n\nCierra #${issueNumber}`;

              try {
                await github.rest.pulls.create({
                  owner,
                  repo,
                  title: prTitle,
                  body: prBody,
                  head: `${owner}:${branchName}`,
                  base: defaultBranch,
                  draft: true
                });
              } catch (prErr) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `⚠️ Los cambios se han subido a la rama \`${branchName}\`, pero no se ha podido abrir la Pull Request automáticamente (${prErr.message}).`
                });
              }
            }
