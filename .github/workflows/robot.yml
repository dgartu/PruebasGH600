# .github/workflows/robot.yml
name: "Poolside: Laguna S 2.1"

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  robot:
    # Solo dispara si el que comenta es el dueño del repo.
    # En repos públicos, cualquiera puede comentar. Sin esto
    # cualquier usuario drenaría tu API key con @robot.
    if: |
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@robot')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@robot')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@robot')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@robot') || contains(github.event.issue.title, '@robot')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: "Ejecutar Poolside: Laguna S 2.1"
        uses: openrouter-ai/openrouter-github-action@v1
        with:
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: 'poolside/laguna-s-2.1:free'
          prompt: |
            Eres un asistente de codificación experto llamado Poolside: Laguna S 2.1.
            Tu misión es ayudar a implementar issues y revisar código siguiendo las
            convenciones del repositorio.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Implementá el issue siguiendo las convenciones del repositorio:
            - TypeScript estricto
            - ESM modules
            - Tests con vitest
            - Archivos en src/ exportan por nombre, nunca default
            - Tests en tests/<area>.spec.ts

            Después de commitear y pushear, abrí un PR DRAFT (draft: true) contra main,
            con título descriptivo y body que incluya "Closes #${{ github.event.issue.number }}".

          max-tokens: 4000
          temperature: 0.7
          allowed-tools: "mcp__github__create_pull_request,Bash(npm install),Bash(npm test),Bash(npm run typecheck),Bash(npx tsc --noEmit),Edit,Write,Read,Bash"